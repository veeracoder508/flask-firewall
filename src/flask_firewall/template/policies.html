<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ server_name }} - Security Policies</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .card { background-color: #161b22; border: 1px solid #30363d; }
        .table { color: #c9d1d9; }
        .badge-DROP { background-color: #f85149; }
        .badge-ALLOW { background-color: #3fb950; }
    </style>
</head>
<body class="p-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Active Security Policies</h2>
            <a href="/" class="btn btn-outline-primary">Back to Dashboard</a>
        </div>
        
        <div class="card p-3">
            <table class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Description</th>
                        <th>Action</th>
                        <th>Protocol</th>
                        <th>Src CIDR</th>
                        <th>Dst CIDR</th>
                        <th>Port</th>
                    </tr>
                </thead>
                <tbody>
                    {% for rule in rules %}
                    <tr>
                        <td>{{ rule.id }}</td>
                        <td>{{ rule.desc }}</td>
                        <td><span class="badge badge-{{ rule.action }}">{{ rule.action }}</span></td>
                        <td>{{ rule.proto }}</td>
                        <td><code>{{ rule.src }}</code></td>
                        <td><code>{{ rule.dst }}</code></td>
                        <td>{{ rule.dport }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
