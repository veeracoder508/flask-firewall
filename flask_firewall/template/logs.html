<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ server_name }} - Firewall Logs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; }
        .table { color: #c9d1d9; border-color: #30363d; }
        .status-ALLOW { color: #3fb950; font-weight: bold; border-left: 4px solid #3fb950; }
        .status-DROP { color: #f85149; font-weight: bold; border-left: 4px solid #f85149; }
        .log-line { font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; }
        .btn-outline-primary { color: #58a6ff; border-color: #58a6ff; }
    </style>
</head>
<body class="p-4">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-0">Detailed Firewall Logs</h2>
                <small class="text-secondary">Showing last 500 events from {{ server_name }}</small>
            </div>
            <a href="/" class="btn btn-outline-primary">Back to Dashboard</a>
        </div>
        
        <div class="card p-3 shadow-sm">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr>
                            <th style="width: 100px;">Event</th>
                            <th>Log Entry Detail</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for entry in logs %}
                        <tr class="status-{{ entry.status }}">
                            <td>
                                <span class="badge {% if entry.status == 'ALLOW' %}bg-success{% elif entry.status == 'DROP' %}bg-danger{% else %}bg-secondary{% endif %}">
                                    {{ entry.status }}
                                </span>
                            </td>
                            <td class="log-line text-wrap">{{ entry.raw }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
